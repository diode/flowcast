[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#f1f4f8"            # inputs and the sidebar: a tinted surface, not a border
textColor = "#1f2937"
borderColor = "#eef1f5"
dataframeBorderColor = "#eef1f5"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "10px"

[server]
folderWatchList = ["src"]           # reload when the netstudy package changes too, not only dashboard\

[client]
toolbarMode = "minimal"             # no Streamlit menu: the app draws its own (app.py _menu)

[browser]
gatherUsageStats = false
